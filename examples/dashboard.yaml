# Native Home Assistant dashboard example.
# These entity IDs match the default IDs created by the STP Token Updater device.
# If you renamed entities in Home Assistant, adjust them accordingly.

type: vertical-stack
cards:
  - type: heading
    heading: STP Token Updater
    icon: mdi:lock-open-variant-outline

  - type: tile
    entity: sensor.stp_token_updater_token_status
    name: Status
    vertical: false

  - type: tile
    entity: binary_sensor.stp_token_updater_token_valid
    name: Token gültig
    vertical: false

  - type: tile
    entity: sensor.stp_token_updater_token_expires_at
    name: Gültig bis
    vertical: false

  - type: tile
    entity: sensor.stp_token_updater_token_remaining_hours
    name: Restlaufzeit
    vertical: false

  - type: tile
    entity: binary_sensor.stp_token_updater_new_trial_token_available
    name: Neuer Trial-Token verfügbar
    vertical: false

  - type: tile
    entity: sensor.stp_token_updater_trial_candidate_expires_at
    name: Kandidat gültig bis
    vertical: false

  - type: tile
    entity: sensor.stp_token_updater_token_next_attempt
    name: Nächster geplanter Versuch
    vertical: false

  - type: tile
    entity: sensor.stp_token_updater_token_last_check
    name: Letzte Provider-Prüfung
    vertical: false

  - type: tile
    entity: sensor.stp_token_updater_token_last_source_check
    name: Letzte Quellenprüfung
    vertical: false

  - type: tile
    entity: sensor.stp_token_updater_token_last_update
    name: Letzter Updateversuch
    vertical: false

  - type: tile
    entity: sensor.stp_token_updater_token_last_success
    name: Letztes verifiziertes Update
    vertical: false

  - type: tile
    entity: sensor.stp_token_updater_token_update_attempts
    name: Reale Schreibversuche
    vertical: false

  - type: tile
    entity: sensor.stp_token_updater_token_last_error
    name: Letzter Fehler
    vertical: false

  - type: tile
    entity: binary_sensor.stp_token_updater_api_reachable
    name: Provider erreichbar
    vertical: false

  - type: horizontal-stack
    cards:
      - type: button
        entity: button.stp_token_updater_check_trial_token
        name: Trial prüfen
        icon: mdi:refresh
        tap_action:
          action: toggle

      - type: button
        entity: button.stp_token_updater_apply_trial_token_now
        name: Anwenden
        icon: mdi:key-change
        tap_action:
          action: toggle

      - type: button
        entity: button.stp_token_updater_verify_active_token
        name: Verifizieren
        icon: mdi:check-decagram
        tap_action:
          action: toggle
