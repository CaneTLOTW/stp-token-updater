name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant==2026.8.2" pytest aiohttp
      - name: Compile integration
        run: python -m compileall -q custom_components/stp_token_updater tests
      - name: Run tests
        run: python -m pytest -q
