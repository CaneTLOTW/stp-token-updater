name: CI

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/**"
      - "tests/**"
      - "hacs.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "tests/**"
      - "hacs.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant==2026.8.2" pytest aiohttp
      - name: Compile integration
        run: python -m compileall -q custom_components/stp_token_updater tests
      - name: Run tests
        run: python -m pytest -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
